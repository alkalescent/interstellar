name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version:
    name: Version
    needs: test  # Only release after tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the version tag
    outputs:
      new_version: ${{ steps.version.outputs.new_tag }}
      tag_name: ${{ steps.version.outputs.new_tag }}
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Bump version and push tag
      id: version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: minor
        WITH_V: true
        TAG_CONTEXT: repo
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 1.0.3
    
    - name: Set version output
      id: set-version
      run: |
        # Strip 'v' prefix for PyPI-compatible version
        PYPI_VERSION="${NEW_TAG#v}"
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    # Note: hatch-vcs reads version from git tag at build time

  publish:
    name: Publish PyPI
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing to PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.version.outputs.tag_name }}
        fetch-depth: 0  # Full history needed for hatch-vcs
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    
    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      # Uses OIDC trusted publishing - configure at:
      # https://pypi.org/manage/account/publishing/

  build-portable:
    name: Build Portable (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-portable
            binary_name: ''
          - os: macos-latest
            artifact_suffix: macos-portable
            binary_name: ''
          - os: windows-latest
            artifact_suffix: windows-portable.exe
            binary_name: .exe
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.version.outputs.tag_name }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    
    - name: Build onefile binary
      env:
        MODE: onefile
        CI: true
      run: make build
      shell: bash
    
    - name: Rename binary with platform suffix
      run: |
        mv ${{ github.event.repository.name }}${{ matrix.binary_name }} ${{ github.event.repository.name }}-${{ matrix.artifact_suffix }}
        chmod +x ${{ github.event.repository.name }}-${{ matrix.artifact_suffix }} || true
      shell: bash
    
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}-${{ matrix.artifact_suffix }}
        path: ${{ github.event.repository.name }}-${{ matrix.artifact_suffix }}
        if-no-files-found: error

  build-fast:
    name: Build Fast (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.version.outputs.tag_name }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    
    - name: Build standalone distribution
      env:
        MODE: standalone
        CI: true
      run: make build
      shell: bash
    
    - name: Create archive
      run: tar -czf "${{ github.event.repository.name }}-${{ matrix.platform }}-fast.tar.gz" cli.dist/
      shell: bash
    
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}-${{ matrix.platform }}-fast
        path: ${{ github.event.repository.name }}-${{ matrix.platform }}-fast.tar.gz
        if-no-files-found: error

  release:
    name: Release
    # The binary smoke gates the upload; publish stays ahead of smoke-pypi,
    # which installs what publish uploaded
    needs: [version, build-portable, build-fast, smoke-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create the release and upload its assets
      id-token: write  # Needed to sign the build provenance attestation
      attestations: write  # Needed to store the build provenance attestation
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.version.outputs.tag_name }}
        persist-credentials: false

    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts
    
    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -type f -exec cp {} release-assets/ \;
        (cd release-assets && sha256sum -- * > SHA256SUMS)
        ls -lah release-assets/
        cat release-assets/SHA256SUMS
    
    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: release-assets/SHA256SUMS
    
    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        files: release-assets/*
        body: |
          ## 📦 Binary Options
          
          | Variant | Description | Startup Time |
          |---------|-------------|--------------|
          | **Portable** (`*-portable`) | Single file, no installation needed | ~10 sec |
          | **Fast** (`*-fast.tar.gz`) | Optimized for speed, extract and run | ~1 sec |
          
          Choose **Portable** for convenience, **Fast** for performance.
          
          Verify a download with `sha256sum -c SHA256SUMS --ignore-missing` or `gh attestation verify <file> -R ${{ github.repository }}`.
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(needs.version.outputs.new_version, 'alpha') || contains(needs.version.outputs.new_version, 'beta') || contains(needs.version.outputs.new_version, 'rc') }}

  smoke-pypi:
    name: Smoke PyPI
    needs: [version, publish]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    
    - name: Install from PyPI
      run: |
        NAME="${{ github.event.repository.name }}"
        VERSION="${{ needs.version.outputs.pypi_version }}"
        MAX_ATTEMPTS=40
        SLEEP_SECONDS=15

        # Retry the install itself rather than polling an index first. The
        # simple index is CDN-cached per edge, so a separate curl check can
        # see the release while pip's request lands on a stale edge moments
        # later and fails with "No matching distribution found". Retrying the
        # real command makes the check and the action the same client. Only
        # that error for this release is retried; any other install error,
        # such as a dependency with no match, fails at once.
        for i in $(seq 1 $MAX_ATTEMPTS); do
          if OUTPUT=$(pip install "${NAME}==${VERSION}" 2>&1); then
            echo "$OUTPUT"
            echo "Installed ${NAME}==${VERSION} on attempt $i"
            exit 0
          fi
          echo "$OUTPUT"
          if ! grep -qF "No matching distribution found for ${NAME}==${VERSION}" <<< "$OUTPUT"; then
            echo "Install failed with an error other than a missing release"
            exit 1
          fi
          echo "Attempt $i/$MAX_ATTEMPTS: not installable yet, waiting ${SLEEP_SECONDS}s..."
          sleep $SLEEP_SECONDS
        done
        echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
        exit 1

    - name: Run smoke tests
      env:
        EXPECTED_VERSION: ${{ needs.version.outputs.tag_name }}
      run: python tests/smoke.py ${{ github.event.repository.name }}

  smoke-binary:
    name: Smoke Binary (${{ matrix.os }})
    needs: [version, build-portable, build-fast]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-portable
          - os: macos-latest
            artifact_suffix: macos-portable
          - os: windows-latest
            artifact_suffix: windows-portable.exe
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    
    - name: Install package (for import tests)
      run: make ci
    
    - name: Download binary
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ github.event.repository.name }}-${{ matrix.artifact_suffix }}
    
    - name: Make executable
      run: chmod +x ./${{ github.event.repository.name }}-${{ matrix.artifact_suffix }} || true
      shell: bash
    
    - name: Run smoke tests
      env:
        EXPECTED_VERSION: ${{ needs.version.outputs.tag_name }}
      run: make smoke NAME=./${{ github.event.repository.name }}-${{ matrix.artifact_suffix }}

  homebrew:
    name: Update Homebrew
    needs: [version, release]
    runs-on: ubuntu-latest

    steps:
    # The tap is pushed from its own clone with HOMEBREW_TAP_TOKEN, so this
    # checkout keeps no credentials.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # scripts/formula_desc.py reads pyproject.toml with tomllib (Python 3.11+)
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Generate and push formula
      env:
        GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        NAME="${{ github.event.repository.name }}"
        TAG="${{ needs.version.outputs.tag_name }}"
        REPO="${{ github.repository }}"
        
        # Description from pyproject.toml for the formula's Ruby string, via
        # the sed replacement below. The script refuses ", #, and \ and
        # escapes & and | for sed.
        DESCRIPTION=$(python3 scripts/formula_desc.py)
        
        # Calculate SHA256 of release tarball (curl -f fails the step on an HTTP error)
        TARBALL_URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/source.tar.gz" "$TARBALL_URL"
        SHA256=$(shasum -a 256 "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
        
        # Convert name to Ruby class name (capitalize, remove hyphens)
        CLASS_NAME=$(echo "$NAME" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1' | tr -d ' ')
        
        # Build source lines for release (url + sha256 + head)
        SOURCE_LINE="url \"${TARBALL_URL}\"\n  sha256 \"${SHA256}\"\n  head \"https://github.com/${REPO}.git\", branch: \"master\""
        
        # Configure git credentials for GitHub using GITHUB_TOKEN
        git config --global credential.helper store
        git credential approve <<EOF
        protocol=https
        host=github.com
        username=x-access-token
        password=${GITHUB_TOKEN}
        EOF
        
        # Clone homebrew-tap repo (preserves all existing formulas)
        git clone https://github.com/${{ github.repository_owner }}/homebrew-tap.git tap-repo
        cd tap-repo
        
        # Generate formula directly in repo root (no Formula subdirectory)
        sed -e "s|{{NAME}}|${NAME}|g" \
            -e "s|{{CLASS_NAME}}|${CLASS_NAME}|g" \
            -e "s|{{DESCRIPTION}}|${DESCRIPTION}|g" \
            -e "s|{{HOMEPAGE}}|https://github.com/${REPO}|g" \
            -e "s|{{SOURCE_LINE}}|${SOURCE_LINE}|g" \
            ../.github/templates/formula.rb.template > "${NAME}.rb"
        
        echo "Generated formula:"
        cat "${NAME}.rb"
        
        # Commit and push
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add "${NAME}.rb"
        
        if git diff --cached --quiet; then
          echo "No changes to commit for ${NAME}.rb"
        else
          git commit -m "Update ${NAME} to ${TAG}"
        fi
        
        # Only push if there are new commits compared to origin/master
        if git log origin/master..HEAD --oneline | grep -q '.'; then
          git push origin master
        else
          echo "No new commits to push"
        fi

  smoke-homebrew:
    name: Smoke Homebrew
    needs: [version, homebrew]
    runs-on: macos-latest
    
    steps:
    - name: Tap and install formula
      run: |
        brew tap ${{ github.repository_owner }}/tap
        brew trust ${{ github.repository_owner }}/tap
        brew install ${{ github.event.repository.name }}
    
    - name: Run formula test
      run: brew test ${{ github.event.repository.name }}
    
    - name: Verify CLI works
      run: |
        ${{ github.event.repository.name }} version
        ${{ github.event.repository.name }} --help
