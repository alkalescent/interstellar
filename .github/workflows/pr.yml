name: Pull Request

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  qr:
    name: QR Codes
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push QR code updates
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.head_ref }}
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    
    - name: Install dependencies
      run: make ci
    
    - name: Generate QR codes
      run: make qr
    
    - name: Commit if changed
      # This repository's token cannot push to a fork's branch
      if: github.event.pull_request.head.repo.full_name == github.repository
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add assets/
        if ! git diff --cached --quiet; then
          git commit -m "Update QR codes"
          git push
        fi

  version:
    name: Version Preview
    needs: test  # Only run after tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Needed to comment the version preview
      id-token: write  # Required for OIDC trusted publishing to TestPyPI
    outputs:
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ github.event.repository.name }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Need full history for version calculation
        persist-credentials: false
    
    - name: Calculate next version (dry run)
      id: version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRY_RUN: true
        DEFAULT_BUMP: minor
        WITH_V: true
        PRERELEASE: true
        PRERELEASE_SUFFIX: rc
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 1.0.3
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
    
    - name: Calculate prerelease version
      id: set-version
      run: |
        # Get base version from tag action (e.g., v1.2.0-rc.0)
        BASE_TAG="${NEW_TAG}"
        # Strip 'v' prefix and '-rc.X' suffix to get base version (e.g., 1.2.0)
        BASE_VERSION="${BASE_TAG#v}"
        BASE_VERSION="${BASE_VERSION%-rc.*}"
        # Create unique prerelease version: {base}rc{pr_number}.dev{run_number}
        # e.g., 1.2.0rc42.dev7 for PR #42, run #7
        PYPI_VERSION="${BASE_VERSION}rc${{ github.event.pull_request.number }}.dev${{ github.run_number }}"
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    
    - name: Build distributions
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.set-version.outputs.pypi_version }}
      run: |
        uv build --sdist
        uv build --wheel
    
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        # Uses OIDC trusted publishing - configure at:
        # https://test.pypi.org/manage/account/publishing/
    
    - name: Comment version info on PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const oldTag = '${{ steps.version.outputs.old_tag }}' || 'none';
          const newTag = '${{ steps.version.outputs.new_tag }}';
          const part = '${{ steps.version.outputs.part }}';
          
          // Extract base version (remove -rc.X suffix for display)
          const baseVersion = newTag.replace(/-rc\.\d+$/, '');
          
          const body = `## 📦 Version Preview
          
          - **Current version:** \`${oldTag}\`
          - **Bump type:** \`${part}\`
          - **Release version:** \`${baseVersion}\`
          - **TestPyPI version:** \`${newTag}\`
          
          When this PR is merged, version will be bumped to \`${baseVersion}\`.
          
          To change the bump type, include in commit message: \`#major\`, \`#minor\`, or \`#patch\``;
          
          // Find existing bot comment with version preview
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const botComment = comments.find(c => 
            c.user.type === 'Bot' && 
            c.body.includes('## 📦 Version Preview')
          );
          
          if (botComment) {
            // Check if version info changed by comparing release version and bump type
            const oldVersionMatch = botComment.body.match(/Release version:\*\* `([^`]+)`/);
            const oldBumpMatch = botComment.body.match(/Bump type:\*\* `([^`]+)`/);
            const oldReleaseVersion = oldVersionMatch ? oldVersionMatch[1] : '';
            const oldBumpType = oldBumpMatch ? oldBumpMatch[1] : '';
            
            if (oldReleaseVersion === baseVersion && oldBumpType === part) {
              console.log('Version info unchanged, skipping comment update');
              return;
            }
            
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Updated existing version comment');
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Created new version comment');
          }

  smoke-pypi:
    name: Smoke PyPI
    needs: version
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Install dependencies from PyPI
      run: |
        # Dependencies come from PyPI, pinned by hash in uv.lock, so a project
        # on TestPyPI under a dependency's name is never installed.
        uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
        pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"

    - name: Install from TestPyPI
      run: |
        NAME="${{ github.event.repository.name }}"
        VERSION="${{ needs.version.outputs.pypi_version }}"
        MAX_ATTEMPTS=40
        SLEEP_SECONDS=15

        # Retry the install itself rather than polling an index first. The
        # simple index is CDN-cached per edge, so a separate curl check can
        # see the release while pip's request lands on a stale edge moments
        # later and fails with "No matching distribution found". Retrying the
        # real command makes the check and the action the same client. Only
        # that error is retried; any other install error fails at once.
        for i in $(seq 1 $MAX_ATTEMPTS); do
          if OUTPUT=$(pip install --no-deps --index-url https://test.pypi.org/simple/ \
            "${NAME}==${VERSION}" 2>&1); then
            echo "$OUTPUT"
            echo "Installed ${NAME}==${VERSION} on attempt $i"
            exit 0
          fi
          echo "$OUTPUT"
          if ! grep -qF "No matching distribution found" <<< "$OUTPUT"; then
            echo "Install failed with an error other than a missing release"
            exit 1
          fi
          echo "Attempt $i/$MAX_ATTEMPTS: not installable yet, waiting ${SLEEP_SECONDS}s..."
          sleep $SLEEP_SECONDS
        done
        echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
        exit 1
    
    - name: Run smoke tests
      env:
        EXPECTED_VERSION: v${{ needs.version.outputs.pypi_version }}
      run: python tests/smoke.py ${{ github.event.repository.name }}

  smoke-homebrew:
    name: Smoke Homebrew
    needs: test
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # scripts/formula_desc.py reads pyproject.toml with tomllib (Python 3.11+)
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Create local tap and generate formula
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        NAME="${{ github.event.repository.name }}"
        REPO="${{ github.repository }}"

        # The branch name goes into a Ruby string and a sed replacement below,
        # so accept only plain branch-name characters
        case "$HEAD_REF" in
          *[!A-Za-z0-9._/-]*)
            echo "Branch name has characters the formula cannot hold: $HEAD_REF"
            exit 1
            ;;
        esac

        # Create a local tap
        brew tap-new local/tap
        TAP_PATH="$(brew --repository)/Library/Taps/local/homebrew-tap/Formula"
        mkdir -p "$TAP_PATH"
        
        # Description from pyproject.toml for the formula's Ruby string, via
        # the sed replacement below. The script refuses ", #, and \ and
        # escapes & and | for sed.
        DESCRIPTION=$(python3 scripts/formula_desc.py)
        
        # Convert name to Ruby class name (capitalize, remove hyphens)
        CLASS_NAME=$(echo "$NAME" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1' | tr -d ' ')
        
        # Build source line for HEAD install (points to PR branch, in a fork for fork PRs)
        SOURCE_LINE="head \"https://github.com/${HEAD_REPO}.git\", branch: \"${HEAD_REF}\""
        
        # Generate formula from template into the tap
        sed -e "s|{{NAME}}|${NAME}|g" \
            -e "s|{{CLASS_NAME}}|${CLASS_NAME}|g" \
            -e "s|{{DESCRIPTION}}|${DESCRIPTION}|g" \
            -e "s|{{HOMEPAGE}}|https://github.com/${REPO}|g" \
            -e "s|{{SOURCE_LINE}}|${SOURCE_LINE}|g" \
            .github/templates/formula.rb.template > "$TAP_PATH/${NAME}.rb"
        
        echo "Generated formula at $TAP_PATH/${NAME}.rb:"
        cat "$TAP_PATH/${NAME}.rb"
    
    - name: Install formula from HEAD
      run: brew install --HEAD local/tap/${{ github.event.repository.name }}
    
    - name: Run formula test
      run: brew test local/tap/${{ github.event.repository.name }}
    
    - name: Verify CLI works
      run: |
        ${{ github.event.repository.name }} version
        ${{ github.event.repository.name }} --help

